# Review template only. Replace every CHANGE_ME value before applying.
# Creating resources, granting IAM or enabling public invocation requires owner approval.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: japan-travel-chat
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/minScale: '0'
    run.googleapis.com/maxScale: '1'
spec:
  template:
    spec:
      serviceAccountName: travel-chat-runtime@CHANGE_ME_PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 110
      containers:
        - image: CHANGE_ME_IMAGE_URI
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: CHAT_ACCESS_MODE
              value: shared
            - name: CHAT_PUBLIC_ORIGIN
              value: https://CHANGE_ME_SERVICE_HOST
            - name: GOOGLE_CLOUD_PROJECT
              value: CHANGE_ME_PROJECT_ID
            - name: CHAT_FIRESTORE_COLLECTION
              value: travelChatAccess
            - name: CHAT_DAILY_REQUEST_LIMIT
              value: '100'
            - name: CHAT_SESSION_DAILY_REQUEST_LIMIT
              value: '20'
            - name: CHAT_SESSION_HOURS
              value: '4'
            # Off by default. Enable only for the owner's temporary anonymous test.
            - name: CHAT_ALLOW_ANONYMOUS_TEST
              value: 'false'
            - name: CHAT_ANONYMOUS_SESSION_DAILY_LIMIT
              value: '100'
            - name: GEMINI_MODEL
              value: gemini-3.8-flash
            # Vertex uses the dedicated runtime service identity (ADC).
            # No API key or service-account JSON is injected into this mode.
            - name: GEMINI_PROVIDER
              value: vertex
            - name: GOOGLE_CLOUD_LOCATION
              value: global

            # Keep Google Places disabled until billing, secret scope and policy pages are approved.
            - name: PLACES_PHOTOS_ENABLED
              value: 'false'
            - name: PLACES_DAILY_REQUEST_LIMIT
              value: '100'
            - name: PLACES_SESSION_DAILY_REQUEST_LIMIT
              value: '80'
            # On enable: inject GOOGLE_PLACES_API_KEY from a restricted Secret Manager version,
            # then set PLACES_TERMS_URL and PLACES_PRIVACY_URL to reviewed public HTTPS pages.
